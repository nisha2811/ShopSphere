spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.application.name=shopsphere
server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopsphere_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.time-zone=UTC

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.seed.enabled=${SEED_DATA_ENABLED:true}
app.seed.demo-users=${SEED_DEMO_USERS:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@shopsphere.local}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.customer-email=${SEED_CUSTOMER_EMAIL:customer@shopsphere.local}
app.seed.customer-password=${SEED_CUSTOMER_PASSWORD:Password@123}

springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
