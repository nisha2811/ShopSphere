server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: any unknown path falls back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy API calls to the backend container.
    # Same-origin from the browser's point of view, so no CORS preflight is needed.
    location /api/ {
        proxy_pass http://backend:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;

        proxy_set_header Cookie $http_cookie;
        proxy_set_header Set-Cookie $upstream_http_set_cookie;

        proxy_pass_request_headers on;

        proxy_cookie_path / /;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8088/swagger-ui/;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8088/v3/api-docs/;
    }

    # Cache static assets aggressively; index.html always revalidates
    location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
